name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verify release source
        run: |
          python -m unittest discover -s tests -q
          python -m compileall -q usage_monitor_for_copilot
          python -m pyright
      - name: Build executable
        run: python build.py
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/UsageMonitorForCopilot.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  UsageMonitorForCopilot.exe" | Set-Content -Encoding ascii dist/UsageMonitorForCopilot.exe.sha256
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/UsageMonitorForCopilot.exe `
            dist/UsageMonitorForCopilot.exe.sha256 `
            --verify-tag `
            --title "Usage Monitor for Copilot ${{ github.ref_name }}" `
            --generate-notes
